<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tubeit - בדיקת כתוביות עברית</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 16px;
  }
  h2 { text-align: center; margin-bottom: 16px; }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    font-size: 16px;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #e33;
    color: white;
    font-size: 16px;
    font-weight: bold;
  }
  .wrap {
    position: relative;
    width: 100%;
    padding-bottom: 56.25%;
    height: 0;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    display: none;
  }
  .wrap.active { display: block; }
  iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }
  .status {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin-top: 8px;
    min-height: 20px;
  }
  .error { color: #f66; }
</style>
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<h2>Tubeit — בדיקת כתוביות עברית</h2>

<div class="input-row">
  <input type="text" id="urlInput" placeholder="הדבק קישור יוטיוב כאן..." />
  <button onclick="loadVideo()">טען</button>
</div>

<div class="status" id="status"></div>

<div class="wrap" id="playerWrap">
  <div id="player"></div>
</div>

<script>
function extractVideoId(url) {
  url = url.trim();
  // youtu.be/ID
  let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/watch?v=ID
  m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/embed/ID
  m = url.match(/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/shorts/ID
  m = url.match(/shorts\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // Maybe they just pasted the raw ID
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return null;
}

let ytPlayer = null;
let apiReady = false;
let pendingVideoId = null;
let captionRetryCount = 0;
let captionRetryTimer = null;
const MAX_CAPTION_RETRIES = 4;
const CAPTION_RETRY_BASE_DELAY = 600; // ms, exponential backoff

function loadVideo() {
  const input = document.getElementById('urlInput').value;
  const status = document.getElementById('status');
  const wrap = document.getElementById('playerWrap');
  const id = extractVideoId(input);

  if (!id) {
    status.textContent = 'לא הצלחתי לזהות מזהה סרטון מהקישור הזה. נסה להדביק את הקישור המלא.';
    status.className = 'status error';
    wrap.classList.remove('active');
    return;
  }

  status.textContent = 'טוען מזהה סרטון: ' + id;
  status.className = 'status';
  wrap.classList.add('active');

  if (!apiReady) {
    pendingVideoId = id;
    return;
  }
  requestVideo(id);
}

function requestVideo(id) {
  resetCaptionRetries();
  if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
    ytPlayer.loadVideoById(id);
    applyHebrewCaptions(ytPlayer);
    return;
  }
  ytPlayer = new YT.Player('player', {
    videoId: id,
    playerVars: {
      cc_load_policy: 1,
      cc_lang_pref: 'he',
      hl: 'he',
      playsinline: 1
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange
    }
  });
}

function applyHebrewCaptions(player) {
  try { player.loadModule('captions'); } catch (e) {}
  try { player.setOption('captions', 'track', { languageCode: 'he' }); } catch (e) {}
}

function onPlayerReady(event) {
  resetCaptionRetries();
  applyHebrewCaptions(event.target);
  setTimeout(function () { applyHebrewCaptions(event.target); }, 300);
}

function onPlayerStateChange(event) {
  if (event.data !== YT.PlayerState.PLAYING) return;
  if (captionRetryCount >= MAX_CAPTION_RETRIES) return;
  if (captionRetryTimer) clearTimeout(captionRetryTimer);
  const delay = CAPTION_RETRY_BASE_DELAY * Math.pow(2, captionRetryCount);
  captionRetryTimer = setTimeout(function () {
    applyHebrewCaptions(event.target);
    captionRetryCount++;
  }, delay);
}

function resetCaptionRetries() {
  captionRetryCount = 0;
  if (captionRetryTimer) { clearTimeout(captionRetryTimer); captionRetryTimer = null; }
}

function onYouTubeIframeAPIReady() {
  apiReady = true;
  if (pendingVideoId) {
    const id = pendingVideoId;
    pendingVideoId = null;
    requestVideo(id);
  }
}

// Allow Enter key to trigger load
document.getElementById('urlInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loadVideo();
});
</script>

</body>
</html>
