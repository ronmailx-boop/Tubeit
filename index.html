<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tubeit - פתיחת יוטיוב עם כתוביות עברית</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #111;
    color: #eee;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 16px;
  }
  h2 { text-align: center; margin-bottom: 8px; }
  p.hint {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin: 0 0 16px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #222;
    color: #eee;
    font-size: 16px;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #e33;
    color: white;
    font-size: 16px;
    font-weight: bold;
  }
  .status {
    text-align: center;
    color: #999;
    font-size: 14px;
    margin-top: 8px;
    min-height: 20px;
  }
  .error { color: #f66; }
</style>
</head>
<body>

<h2>Tubeit</h2>
<p class="hint">הדביקו קישור יוטיוב, ו-Tubeit יפתח אותו ישירות באפליקציית יוטיוב</p>

<div class="input-row">
  <input type="text" id="urlInput" placeholder="הדבק קישור יוטיוב כאן..." />
  <button onclick="loadVideo()">פתח ביוטיוב</button>
</div>

<div class="status" id="status"></div>

<script>
function extractVideoId(url) {
  url = url.trim();
  // youtu.be/ID
  let m = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/watch?v=ID
  m = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/embed/ID
  m = url.match(/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // youtube.com/shorts/ID
  m = url.match(/shorts\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // Maybe they just pasted the raw ID
  if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
  return null;
}

function openInYouTube(id) {
  const watchUrl = 'https://www.youtube.com/watch?v=' + id;
  const isAndroid = /Android/i.test(navigator.userAgent);

  if (isAndroid) {
    location.href = 'intent://www.youtube.com/watch?v=' + id +
      '#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=' +
      encodeURIComponent(watchUrl) + ';end;';
  } else {
    location.href = watchUrl;
  }
}

function loadVideo() {
  const input = document.getElementById('urlInput').value;
  const status = document.getElementById('status');
  const id = extractVideoId(input);

  if (!id) {
    status.textContent = 'לא הצלחתי לזהות מזהה סרטון מהקישור הזה. נסה להדביק את הקישור המלא.';
    status.className = 'status error';
    return;
  }

  status.textContent = 'פותח באפליקציית יוטיוב...';
  status.className = 'status';
  openInYouTube(id);
}

// Allow Enter key to trigger load
document.getElementById('urlInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') loadVideo();
});
</script>

</body>
</html>
