<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בדיקת כתוביות עברית</title>
<style>
  body { background:#111; color:#eee; font-family:sans-serif; margin:0; padding:16px; }
  .wrap { position:relative; width:100%; padding-bottom:56.25%; height:0; }
  iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  h3 { text-align:center; }
</style>
</head>
<body>
<h3>בדיקת Auto-translate עברית</h3>
<div class="wrap">

    src="https://www.youtube.com/embed/dQw4w9WgXcQ?cc_load_policy=1&cc_lang_pref=he"
    allow="autoplay; encrypted-media; picture-in-picture"
    allowfullscreen
    title="test">
  </iframe>
</div>
</body>
</html>
